<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>{% block title %}{% endblock %}</title>
<style>
 body{font-family:Arial,sans-serif;background:#f2f4f8;margin:0;display:flex;justify-content:center;padding-top:40px}
 .card{background:#fff;padding:28px 32px;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.12);width:380px}
 h1{font-size:22px;margin:0 0 18px}
 label{display:block;margin:12px 0 4px;font-size:14px}
 input[type=text],input[type=password],input[type=email],input[type=tel],select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #bbb;border-radius:5px;font-size:14px}
 textarea{height:90px}
 button{margin-top:18px;padding:10px 18px;border:0;border-radius:5px;background:#2f6fed;color:#fff;font-size:15px;cursor:pointer}
 .alert{padding:9px 12px;border-radius:5px;margin-bottom:12px;font-size:14px}
 .alert.error{background:#fde8e8;color:#a61b1b}.alert.info{background:#e6f4ea;color:#1e6b34}
 .err{color:#c0392b;font-size:12px;min-height:14px;display:block}
 .chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}.chk label{margin:0}
</style>
</head>
<body><div class="card">{% block body %}{% endblock %}</div></body>
</html>
